version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: hitacademy-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: akademi_valorant
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend
    container_name: hitacademy-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: akademi_valorant
      JWT_SECRET: supersecret
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  db_data:
